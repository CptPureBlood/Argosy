name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run game logic tests
        run: npm test

      - name: Add Android platform
        run: npx cap add android

      - name: Install app icon
        run: |
          rm -f android/app/src/main/res/drawable*/ic_launcher_foreground.xml android/app/src/main/res/mipmap-anydpi-v26/*.xml
          cp -r resources/android/res/* android/app/src/main/res/

      - name: Lock to portrait
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MareNostrum-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MareNostrum.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MareNostrum.apk --title "Mare Nostrum – latest build" --notes "Debug APK built from commit ${GITHUB_SHA::7}. Enable 'install unknown apps' on your phone to install."
